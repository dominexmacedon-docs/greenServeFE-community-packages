name: Publish approved community package

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Approved submission Pull Request number"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: community-package-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Verify approval and publish immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out registry
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify owner approval and download submission
        id: submission
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$ACTOR" != "$GH_OWNER" ]]; then
            echo "::error::Only the repository owner may publish community packages."
            exit 1
          fi

          PR="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")"
          echo "$PR" > pr.json
          jq -e '.state == "open" and .base.ref == "main" and .head.repo.full_name != null' pr.json >/dev/null || {
            echo "::error::The Pull Request must be open, target main, and come from an accessible repository."
            exit 1
          }

          HEAD_REPO="$(jq -r '.head.repo.full_name' pr.json)"
          HEAD_SHA="$(jq -r '.head.sha' pr.json)"

          gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" > reviews-pages.json
          jq -e --arg owner "$GH_OWNER" --arg sha "$HEAD_SHA" '
            [ .[][] | select(.user.login == $owner and .state == "APPROVED" and .commit_id == $sha) ] | length > 0
          ' reviews-pages.json >/dev/null || {
            echo "::error::The repository owner must approve the exact current Pull Request head commit before publication."
            exit 1
          }

          gh api --paginate --jq '.[].filename' "repos/$GH_REPO/pulls/$PR_NUMBER/files" > changed-files.txt
          mapfile -t changed < changed-files.txt
          if [[ "${#changed[@]}" -ne 2 ]]; then
            echo "::error::The PR must contain exactly package.json and one platform ZIP."
            exit 1
          fi

          META_PATH="$(printf '%s\n' "${changed[@]}" | grep -E '^submissions/[a-z0-9]+(-[a-z0-9]+)*/[^/]+/package\.json$' || true)"
          if [[ -z "$META_PATH" ]]; then
            echo "::error::Missing submissions/<name>/<version>/package.json."
            exit 1
          fi

          NAME="$(printf '%s' "$META_PATH" | cut -d/ -f2)"
          VERSION="$(printf '%s' "$META_PATH" | cut -d/ -f3)"
          if [[ -e "$META_PATH" ]]; then
            echo "::error::Package metadata already exists at $META_PATH; published versions are immutable."
            exit 1
          fi
          RAW="https://raw.githubusercontent.com/$HEAD_REPO/$HEAD_SHA"

          mkdir -p publication
          curl --fail --location --retry 3 --silent --show-error "$RAW/$META_PATH" -o publication/package.json

          readarray -t identity < <(python3 - publication/package.json "$NAME" "$VERSION" <<'PY'
          import json, re, sys
          path, expected_name, expected_version = sys.argv[1:]
          data = json.load(open(path, encoding="utf-8"))
          if data.get("name") != expected_name or data.get("version") != expected_version:
              raise SystemExit("Metadata name/version do not match the submission directory.")
          platforms = data.get("platforms")
          if not isinstance(platforms, list) or len(platforms) != 1 or not isinstance(platforms[0], str):
              raise SystemExit("Exactly one platform must be declared.")
          platform = platforms[0]
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]{0,63}", platform):
              raise SystemExit("Invalid platform identifier.")
          print(platform)
          print(f"{expected_name}-{platform}.zip")
          PY
          )
          PLATFORM="${identity[0]}"
          ZIP_NAME="${identity[1]}"
          ZIP_PATH="submissions/$NAME/$VERSION/$ZIP_NAME"
          EXPECTED_META="submissions/$NAME/$VERSION/package.json"
          if [[ "${changed[0]}" != "$EXPECTED_META" && "${changed[1]}" != "$EXPECTED_META" ]] || \
             [[ "${changed[0]}" != "$ZIP_PATH" && "${changed[1]}" != "$ZIP_PATH" ]]; then
            echo "::error::The PR must contain only package.json and $ZIP_NAME in the matching package/version directory."
            exit 1
          fi

          curl --fail --location --retry 3 --silent --show-error "$RAW/$ZIP_PATH" -o "publication/$ZIP_NAME"

          python3 scripts/validate_submission.py \
            --metadata publication/package.json \
            --zip "publication/$ZIP_NAME" \
            --expected-name "$NAME" \
            --expected-version "$VERSION"

          TAG="$NAME-v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Version tag $TAG already exists. Published versions cannot be replaced."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release for $TAG already exists. Published versions cannot be replaced."
            exit 1
          fi

          DIGEST="$(sha256sum "publication/$ZIP_NAME" | awk '{print $1}')"
          printf '%s  %s\n' "$DIGEST" "$ZIP_NAME" > "publication/$ZIP_NAME.sha256"
          printf 'Package: %s\nVersion: %s\nDeveloper: %s\nCompatibility: %s\nPlatform: %s\n\nSHA-256: %s\n\nThis release was reviewed and manually published by the repository owner. Published versions are immutable.\n' \
            "$NAME" "$VERSION" "$(jq -r '.author' publication/package.json)" \
            "$(jq -r '.greenServeFE' publication/package.json)" \
            "$PLATFORM" "$DIGEST" > publication/RELEASE_NOTES.md

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "head_repo=$HEAD_REPO" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.submission.outputs.tag }}" \
            "publication/${{ steps.submission.outputs.zip_name }}#${{ steps.submission.outputs.zip_name }}" \
            "publication/${{ steps.submission.outputs.zip_name }}.sha256#${{ steps.submission.outputs.zip_name }}.sha256" \
            --title "${{ steps.submission.outputs.tag }}" \
            --notes-file publication/RELEASE_NOTES.md \
            --target main

      - name: Update versioned registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/update_registry.py \
            --metadata publication/package.json \
            --repository "$GITHUB_REPOSITORY" \
            --tag "${{ steps.submission.outputs.tag }}" \
            --sha256 "${{ steps.submission.outputs.digest }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          META_DEST="submissions/${{ steps.submission.outputs.name }}/${{ steps.submission.outputs.version }}/package.json"
          mkdir -p "$(dirname "$META_DEST")"
          if [[ -e "$META_DEST" ]]; then
            echo "::error::Package metadata already exists at $META_DEST; refusing to overwrite a published version."
            exit 1
          fi
          cp publication/package.json "$META_DEST"

          git add registry/index.json "$META_DEST"
          git diff --cached --check
          git commit -m "Publish ${{ steps.submission.outputs.name }} v${{ steps.submission.outputs.version }}"
          git push origin HEAD:main

      - name: Record publication and close submission PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr comment "${{ steps.submission.outputs.pr_number }}" --body \
            "Approved and published as [${{ steps.submission.outputs.name }} v${{ steps.submission.outputs.version }}](https://github.com/$GITHUB_REPOSITORY/releases/tag/${{ steps.submission.outputs.tag }}). The platform ZIP and SHA-256 checksum are attached to the release. The package.json metadata is stored at submissions/${{ steps.submission.outputs.name }}/${{ steps.submission.outputs.version }}/package.json in the repository, and the registry has been updated. This submission PR is being closed without merging so binary ZIP files do not accumulate in the Git history."
          gh pr close "${{ steps.submission.outputs.pr_number }}"
